name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake \
            git libffi-dev libltdl-dev libssl-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            openjdk-17-jdk pkg-config unzip zip zlib1g-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install --upgrade setuptools==69.0.2 wheel==0.42.0
          python -m pip install \
            buildozer \
            cython==0.29.34

      - name: Cache Buildozer and Android dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: |
          # GitHub runner 预装 NDK 27c，但官方验证组合用 NDK 29（buildozer.spec 已设 android.ndk=29）。
          # 去掉预装 NDK 的环境变量，强制 buildozer 按 spec 自行下载 NDK 29。
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tavern-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
