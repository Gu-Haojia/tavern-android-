name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-dev python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            libjpeg-dev libfreetype6-dev \
            libgl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxi-dev \
            build-essential

      - name: Clean pip and install compatible versions
        run: |
          python3 -m pip install --upgrade pip==23.3.2
          python3 -m pip install --upgrade setuptools==68.2.2 wheel==0.41.3

      - name: Install buildozer and cython with pinned versions
        run: |
          python3 -m pip install \
            'buildozer==1.5.0' \
            'cython==0.29.36'

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tavern-apk
          path: bin/*.apk
